-end="url(#arrow)"/><text x="1070" y="1417" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#3C4E63" text-anchor="middle" dominant-baseline="middle">Health history</text><text x="40" y="1547" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#365FAD" text-anchor="start" dominant-baseline="middle">HOW TO READ</text><text x="40" y="1576" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#25364A" text-anchor="start" dominant-baseline="middle">Rectangle = user   •   Rounded box = process   •   Divided box = data store   •   Arrow = direction of data</text><text x="40" y="1604" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#617387" text-anchor="start" dominant-baseline="middle">Repeated users and store IDs refer to the same entity or store. Rows show data flows, not a sequence of steps.</text><text x="40" y="1632" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#617387" text-anchor="start" dominant-baseline="middle">Selected business processes. Authentication and routine logging are omitted.</text></svg>