ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# Railway terminates HTTPS before forwarding requests to Apache.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<DirectoryMatch "^/var/www/html/(config|includes|deploy|docs|migrations|tests|backups)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(?i)(^\.|\.(sql|md|ini|sh|txt|toml)$|^Dockerfile$)">
    Require all denied
</FilesMatch>
<Directory /var/www/html/uploads>
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
